<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Kreator Video - Visualizer Pro</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .control-panel {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            flex: 1;
            min-width: 300px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .preview-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        canvas {
            background-color: #000000;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            max-width: 100%;
            height: auto;
        }
        h2 { color: #00ffcc; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input[type="text"], select, input[type="file"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }
        .btn {
            background-color: #00ffcc;
            color: #121212;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            transition: 0.3s;
        }
        .btn:hover { background-color: #00ccaa; }
        .btn-export { background-color: #ff3366; color: white; }
        .btn-export:hover { background-color: #cc2252; }
    </style>
</head>
<body>

    <h1 style="color: #00ffcc; text-align: center;">Studio Pembuat Konten Video</h1>
    <p style="color: #aaa; text-align: center; margin-bottom: 30px;">Buat video visualizer musik & kutipan ayat otomatis untuk Reels atau YouTube</p>

    <div class="container">
        <!-- Panel Kontrol Pengaturan -->
        <div class="control-panel">
            <h2>⚙️ Pengaturan Video</h2>
            
            <div class="form-group">
                <label for="ratioSelect">Pilih Ukuran Rasio Video:</label>
                <select id="ratioSelect">
                    <option value="portrait">Portrait (9:16) - Untuk Reels / TikTok</option>
                    <option value="landscape">Landscape (16:9) - Untuk YouTube / TV</option>
                </select>
            </div>

            <div class="form-group">
                <label>1. Unggah Gambar Latar (Background):</label>
                <input type="file" id="bgInput" accept="image/*">
            </div>

            <div class="form-group">
                <label>2. Unggah Audio / Lagu (.mp3):</label>
                <input type="file" id="audioInput" accept="audio/*">
            </div>

            <div class="form-group">
                <label>3. Tulis Teks Kutipan / Lirik:</label>
                <input type="text" id="textInput" placeholder="Masukkan kutipan ayat atau kata-kata...">
            </div>

            <div class="form-group">
                <label for="colorSelect">Warna Gelombang Visualizer:</label>
                <select id="colorSelect">
                    <option value="#00ffcc">Hijau Neon</option>
                    <option value="#ff3366">Pink Elektrik</option>
                    <option value="#ffff00">Kuning Cerah</option>
                    <option value="#ffffff">Putih Bersih</option>
                </select>
            </div>

            <button class="btn" id="btnPlay">▶️ Putar Musik & Animasi</button>
            <button class="btn btn-export" id="btnExport">📥 Ekspor Jadi Video (.mp4)</button>
        </div>

        <!-- Panel Layar Pratinjau -->
        <div class="preview-panel">
            <h2 style="align-self: flex-start;">📺 Layar Pratinjau</h2>
            <canvas id="videoCanvas" width="360" height="640"></canvas>
            <p style="font-size: 12px; color: #777; margin-top: 10px;">*Proses perekaman video berjalan real-time sesuai durasi lagu</p>
        </div>
    </div>

    <!-- Menghubungkan ke file logika visualizer yang akan kita buat setelah ini -->
    <script src="visualizer.js"></script>
</body>
</html>
