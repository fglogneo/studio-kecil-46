<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Kreator Pro - Drag & Drop</title>
    <!-- Memanggil Google Fonts untuk Pilihan Font Estetik -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body {
            background-color: #0d0d13;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .container {
            max-width: 1000px; width: 100%;
            display: flex; flex-wrap: wrap; gap: 20px; justify-content: center;
        }
        .control-panel {
            background-color: #151522;
            padding: 20px; border-radius: 16px;
            flex: 1; min-width: 320px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .preview-panel {
            display: flex; flex-direction: column; align-items: center;
        }
        .canvas-container {
            position: relative;
            background-color: #000000;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            overflow: hidden;
        }
        canvas { display: block; max-width: 100%; height: auto; }
        h2 { color: #00ffcc; margin-top: 0; font-size: 20px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #aaa; }
        input[type="text"], select, input[type="file"], input[type="range"] {
            width: 100%; padding: 10px; border-radius: 8px;
            border: 1px solid #2a2a40; background-color: #1e1e30;
            color: #fff; box-sizing: border-box; font-size: 13px;
        }
        .row { display: flex; gap: 10px; }
        .btn {
            background: linear-gradient(135deg, #00ffcc, #00aaff);
            color: #0d0d13; border: none; padding: 14px;
            border-radius: 8px; cursor: pointer; font-weight: bold;
            width: 100%; margin-top: 10px; transition: 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,255,204,0.3); }
        .btn-export { background: linear-gradient(135deg, #ff3366, #ff6600); color: white; }
        .back-home { color: #00ffcc; text-decoration: none; font-size: 14px; margin-bottom: 15px; align-self: flex-start; }
    </style>
</head>
<body>

    <a href="../index.html" class="back-home">⬅️ Kembali ke Dashboard Utama</a>

    <div class="container">
        <!-- Panel Kontrol Pengaturan Kiri -->
        <div class="control-panel">
            <h2>⚙️ Studio Editor (CapCut Style)</h2>
            
            <div class="form-group">
                <label>Ukuran Rasio Video:</label>
                <select id="ratioSelect">
                    <option value="portrait">Portrait (9:16) - Reels / TikTok / Shorts</option>
                    <option value="landscape">Landscape (16:9) - YouTube Reguler</option>
                </select>
            </div>

            <div class="row">
                <div class="form-group" style="flex:1;">
                    <label>🖼️ Foto Background:</label>
                    <input type="file" id="bgInput" accept="image/*">
                </div>
                <div class="form-group" style="flex:1;">
                    <label>🎵 File Audio (.mp3):</label>
                    <input type="file" id="audioInput" accept="audio/*">
                </div>
            </div>

            <div class="form-group">
                <label>📝 Teks Ayat / Kutipan Lirik:</label>
                <input type="text" id="textInput" placeholder="Ketik teks di sini, lalu drag/geser langsung di layar pratinjau...">
            </div>

            <div class="row">
                <div class="form-group" style="flex:1;">
                    <label>🔤 Gaya Tulisan (Font):</label>
                    <select id="fontSelect">
                        <option value="sans-serif">Standar (Sans-Serif)</option>
                        <option value="'Amiri', serif">Gaya Arab / Kaligrafi (Amiri)</option>
                        <option value="'Playfair Display', serif">Estetik Klasik (Playfair)</option>
                        <option value="'Montserrat', sans-serif">Modern Tebal (Montserrat)</option>
                    </select>
                </div>
                <div class="form-group" style="flex:1;">
                    <label>📏 Ukuran Teks:</label>
                    <input type="range" id="fontSizeInput" min="14" max="40" value="22">
                </div>
            </div>

            <div class="row">
                <div class="form-group" style="flex:1;">
                    <label>📊 Model Visualizer:</label>
                    <select id="visualizerStyle">
                        <option value="bars">Balok Bawah Tradisional</option>
                        <option value="circle">Lingkaran Berdenyut (Tengah)</option>
                        <option value="line">Garis Gelombang Neon</option>
                    </select>
                </div>
                <div class="form-group" style="flex:1;">
                    <label>🎨 Warna Efek:</label>
                    <select id="colorSelect">
                        <option value="#00ffcc">Hijau Neon</option>
                        <option value="#ff3366">Pink Elektrik</option>
                        <option value="#ffff00">Kuning Cerah</option>
                        <option value="#ffffff">Putih Bersih</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>✨ Efek Filter Atmosfer:</label>
                <select id="particleEffect">
                    <option value="none">Tanpa Efek Tambahan</option>
                    <option value="snow">Butiran Salju Berjatuhan Cinematic</option>
                    <option value="glow">Efek Kabut Gelap (Vignette)</option>
                </select>
            </div>

            <button class="btn" id="btnPlay">▶️ Mainkan Studio</button>
            <button class="btn btn-export" id="btnExport">📥 Ekspor Video Reels (.mp4)</button>
        </div>

        <!-- Layar Pratinjau Kanan -->
        <div class="preview-panel">
            <h2 style="align-self: flex-start;">📺 Layar Pratinjau (Sentuh & Geser Teks)</h2>
            <div class="canvas-container" id="canvasContainer">
                <canvas id="videoCanvas" width="360" height="640"></canvas>
            </div>
            <p style="font-size: 11px; color: #555; margin-top: 10px;">*Geser teks menggunakan mouse/jari langsung di dalam layar pratinjau</p>
        </div>
    </div>

    <!-- Hubungkan ke logika script baru di folder yang sama -->
    <script src="engine.js"></script>
</body>
</html>
