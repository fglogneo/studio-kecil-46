<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Konten Al-Qur'an & Murottal</title>
    <style>
        body {
            background: linear-gradient(-45deg, #0f0c20, #15102a, #050510, #1a0f30);
            background-size: 400% 400%;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-top: 20px;
        }

        .back-btn {
            align-self: flex-start;
            text-decoration: none;
            color: #00ffcc;
            font-size: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        h1 {
            font-size: 24px;
            background: linear-gradient(to right, #00ffcc, #ff3366);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        select, input, button {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: #151525;
            color: white;
            font-size: 14px;
            outline: none;
        }

        select:focus, input:focus {
            border-color: #00ffcc;
        }

        input { width: 80px; text-align: center; }

        button {
            background: #00ffcc;
            color: #0f0c20;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 204, 0.4);
        }

        /* Preview Box Konten Sosmed */
        .preview-box {
            background: #111;
            border: 2px dashed #00ffcc;
            border-radius: 12px;
            padding: 25px;
            margin-top: 25px;
            text-align: right;
            position: relative;
        }

        .ayat-arab {
            font-size: 28px;
            font-family: 'Amiri', 'Traditional Arabic', serif;
            line-height: 2;
            color: #ffffff;
            margin-bottom: 20px;
            direction: rtl;
        }

        .translation-id, .translation-en {
            font-size: 14px;
            line-height: 1.6;
            margin-top: 12px;
            text-align: left;
            border-left: 3px solid;
            padding-left: 12px;
        }

        .translation-id { border-color: #00ffcc; color: #e0e0e0; }
        .translation-en { border-color: #ff3366; color: #b0b0b0; font-style: italic; }

        .meta-info {
            text-align: left;
            font-size: 12px;
            color: #888;
            margin-top: 15px;
        }

        /* Audio Player Custom */
        .audio-container {
            margin-top: 20px;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
        }

        audio { width: 100%; }

        /* Tombol Copy Cepat */
        .copy-btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: flex-start;
        }

        .copy-btn {
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 12px;
            padding: 6px 12px;
        }
        .copy-btn:hover { background: #ff3366; color: white; }
    </style>
    <!-- PERBAIKAN: Font Arab Google Fonts dikembalikan agar berfungsi -->
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <!-- Tombol Kembali ke Dashboard Utama -->
    <a href="../index.html" class="back-btn">⬅ Kembali ke Dashboard</a>

    <div class="container">
        <h1>📖 Generator Konten Ayat & Murottal</h1>
        
        <!-- Input Pemilihan Surah dan Ayat -->
        <div class="form-group">
            <select id="surahSelect">
                <option value="">Memuat Daftar Surah...</option>
            </select>
            <input type="number" id="ayatInput" min="1" value="1" placeholder="Ayat">
            <button onclick="cariAyat()">Ambil Ayat</button>
        </div>

        <!-- Tempat Menampilkan Hasil Pencarian -->
        <div id="resultArea" style="display: none;">
            
            <div class="preview-box" id="contentToCopy">
                <div class="ayat-arab" id="txtArab"></div>
                <div class="translation-id" id="txtIndo"></div>
                <div class="translation-en" id="txtInggris"></div>
                <div class="meta-info" id="txtMeta"></div>
            </div>

            <!-- Tombol Copy Sekali Klik untuk Caption / Bahan Edit -->
            <div class="copy-btn-group">
                <button class="copy-btn" onclick="copyText('arab')">📋 Copy Arab</button>
                <button class="copy-btn" onclick="copyText('indo')">📋 Copy Indo</button>
                <button class="copy-btn" onclick="copyText('en')">📋 Copy Inggris</button>
                <button class="copy-btn" onclick="copyText('all')">✨ Copy Semua untuk Sosmed</button>
            </div>

            <!-- Pemutar Audio Murottal per Ayat -->
            <div class="audio-container">
                <p style="text-align:left; font-size:12px; margin:0 0 5px 0; color:#00ffcc;">🎵 Murottal Per Ayat (Syeikh As-Sudais):</p>
                <audio id="murottalAudio" controls></audio>
            </div>

        </div>
    </div>

    <!-- BERHASIL DISESUAIKAN: Memanggil logika javascript dari file engine.js luar -->
    <script src="engine.js"></script>
</body>
</html>
