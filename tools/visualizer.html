<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIZ Audio Visualizer Studio - Multi Ratio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vizDark: '#0a0d0b',
                        vizPanel: '#111613',
                        vizBorder: '#222d26',
                        vizGreen: '#00ff66',
                        vizGold: '#fbbf24'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0a0d0b; color: #e2e8f0; font-family: monospace; user-select: none; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #222d26; border-radius: 2px; }
        .btn-opt { background: #18201a; border: 1px solid #28362d; font-size: 10px; padding: 3px 8px; border-radius: 4px; color: #94a3b8; transition: all 0.2s; }
        .btn-opt:hover, .btn-opt.active { background: #00ff66; color: #000; font-weight: bold; border-color: #00ff66; }
        .slider-viz { accent-color: #00ff66; height: 3px; background: #28362d; border-radius: 2px; }
        canvas { touch-action: none; cursor: crosshair; }
    </style>
</head>
<body class="bg-vizDark text-slate-200 min-h-screen flex flex-col h-screen overflow-hidden">

    <!-- TOP BAR CONTROL -->
    <header class="bg-vizPanel border-b border-vizBorder px-3 py-2 flex items-center justify-between gap-2 text-xs flex-wrap">
        <div class="flex items-center gap-2">
            <a href="../index.html" class="text-vizGreen border border-vizGreen/40 px-2 py-1 rounded hover:bg-vizGreen hover:text-black">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <span class="font-bold text-vizGreen tracking-wider">VIZ</span>
            <span class="text-[10px] text-slate-500 hidden sm:inline">| Studio 46</span>
        </div>

        <!-- Inputs Audio, BG & Ratio Select -->
        <div class="flex items-center gap-1.5 flex-wrap">
            <label class="btn-opt cursor-pointer flex items-center gap-1">
                <i class="fa-solid fa-music text-vizGreen"></i> Audio
                <input type="file" id="input-audio" accept="audio/*" class="hidden">
            </label>

            <label class="btn-opt cursor-pointer flex items-center gap-1">
                <i class="fa-solid fa-image text-vizGold"></i> BG
                <input type="file" id="input-bg" accept="image/*" class="hidden">
            </label>

            <!-- PILIHAN RASIO VIDEO -->
            <div class="flex items-center gap-1 bg-black/60 border border-vizBorder rounded px-2 py-0.5">
                <span class="text-[10px] text-slate-400"><i class="fa-solid fa-crop text-vizGreen mr-1"></i>Rasio:</span>
                <select id="canvas-ratio" class="bg-transparent text-vizGreen font-bold text-[11px] focus:outline-none cursor-pointer">
                    <option value="16:9">16:9 (YouTube / PC)</option>
                    <option value="9:16">9:16 (TikTok / Reels / Shorts)</option>
                    <option value="1:1">1:1 (IG Feed Square)</option>
                    <option value="4:5">4:5 (IG Feed Portrait)</option>
                </select>
            </div>

            <!-- RENAME FILE SEBELUM DOWNLOAD -->
            <div class="flex items-center gap-1 bg-black/60 border border-vizBorder rounded px-2 py-0.5">
                <span class="text-[10px] text-slate-400">Nama:</span>
                <input type="text" id="project-name" value="Murottal_Konten" class="bg-transparent text-white w-24 sm:w-28 focus:outline-none text-[11px] font-bold">
            </div>

            <!-- TOMBOL REKAM & UNDUH -->
            <button id="btn-record" class="bg-rose-600 hover:bg-rose-500 text-white font-bold px-3 py-1 rounded flex items-center gap-1 text-xs shadow-lg transition">
                <i class="fa-solid fa-circle text-[8px] animate-pulse"></i> <span id="rec-label">Rekam</span>
            </button>
        </div>
    </header>

    <!-- MAIN WORKSPACE -->
    <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 overflow-hidden">
        
        <!-- SIDEBAR CONTROLS (LEFT) -->
        <div class="lg:col-span-4 bg-vizPanel border-r border-vizBorder p-3 space-y-4 overflow-y-auto max-h-full text-[11px]">
            
            <!-- 1. SECTION VISUALIZER -->
            <div class="space-y-2 border-b border-vizBorder pb-3">
                <div class="flex justify-between items-center text-vizGreen font-bold">
                    <span>VISUALIZER</span>
                    <button id="btn-add-viz" class="btn-opt">+ Viz</button>
                </div>
                
                <div class="grid grid-cols-4 gap-1 pt-1">
                    <button class="btn-opt" onclick="alignViz('center')">Tengah</button>
                    <button class="btn-opt" onclick="alignViz('bottom')">Bawah</button>
                    <button class="btn-opt" onclick="alignViz('full')">Full Width</button>
                    <button class="btn-opt" onclick="alignViz('reset')">Reset Posisi</button>
                </div>

                <div>
                    <label class="text-[10px] text-slate-400">Bentuk Spektrum:</label>
                    <select id="viz-style" class="w-full bg-black border border-vizBorder rounded p-1 text-white">
                        <option value="bars-round">Bars Round (Pelangi)</option>
                        <option value="bars-square">Bars Square</option>
                        <option value="wave-line">Garis Wave Neon</option>
                    </select>
                </div>
            </div>

            <!-- 2. SECTION TEKS -->
            <div class="space-y-2 border-b border-vizBorder pb-3">
                <div class="flex justify-between items-center text-vizGold font-bold">
                    <span>TEKS</span>
                    <button id="btn-add-text" class="btn-opt">+ Text</button>
                </div>
                <input type="text" id="text-content" value="Studio Kecil 46" class="w-full bg-black border border-vizBorder rounded p-1 text-white font-bold">

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <span class="text-[10px] text-slate-400">Besar Font</span>
                        <input type="range" id="text-size" min="16" max="120" value="48" class="w-full slider-viz">
                    </div>
                    <div>
                        <span class="text-[10px] text-slate-400">Opacity</span>
                        <input type="range" id="text-opacity" min="0" max="1" step="0.1" value="1" class="w-full slider-viz">
                    </div>
                </div>

                <div>
                    <span class="text-[10px] text-slate-400 block mb-1">Efek Teks:</span>
                    <div class="flex gap-1 flex-wrap" id="text-effects">
                        <button class="btn-opt active" data-fx="plain">Normal</button>
                        <button class="btn-opt" data-fx="shadow">Bayangan</button>
                        <button class="btn-opt" data-fx="glow">Glow Neon</button>
                    </div>
                </div>
            </div>

            <!-- 3. SECTION BACKGROUND & FX -->
            <div class="space-y-2 border-b border-vizBorder pb-3">
                <div class="text-cyberGreen font-bold">BACKGROUND & FX</div>
                <div class="grid grid-cols-2 gap-2 pt-1">
                    <div>
                        <span class="text-[10px] text-slate-400">Kegelapan</span>
                        <input type="range" id="bg-darkness" min="0" max="1" step="0.05" value="0.3" class="w-full slider-viz">
                    </div>
                    <div>
                        <span class="text-[10px] text-slate-400">Blur</span>
                        <input type="range" id="bg-blur" min="0" max="20" value="0" class="w-full slider-viz">
                    </div>
                </div>
            </div>

        </div>

        <!-- CANVAS PREVIEW & PLAYER BAR (RIGHT) -->
        <div class="lg:col-span-8 bg-black flex flex-col justify-between p-3 relative overflow-hidden">
            
            <div class="flex-1 flex items-center justify-center relative w-full h-full min-h-[300px]">
                <canvas id="viz-canvas" width="1280" height="720" class="max-w-full max-h-[75vh] object-contain border border-vizBorder rounded-lg shadow-2xl bg-vizDark"></canvas>
            </div>

            <!-- Player Bar Bottom -->
            <div class="bg-vizPanel border border-vizBorder p-2 rounded-lg flex items-center gap-3 mt-2 text-xs">
                <button id="btn-play" class="w-9 h-9 rounded-full bg-vizGreen text-black flex items-center justify-center font-bold hover:scale-105 transition">
                    <i class="fa-solid fa-play"></i>
                </button>
                <div class="flex-1">
                    <div class="flex justify-between text-[10px] text-slate-400 mb-1">
                        <span id="track-title">Belum ada audio</span>
                        <span id="track-time">0:00 / 0:00</span>
                    </div>
                    <input type="range" id="audio-seek" value="0" min="0" max="100" class="w-full slider-viz">
                </div>
            </div>

        </div>

    </div>

    <!-- ENGINE CODE JS -->
    <script>
        const canvas = document.getElementById('viz-canvas');
        const ctx = canvas.getContext('2d');

        // Inputs & Controls
        const inputAudio = document.getElementById('input-audio');
        const inputBg = document.getElementById('input-bg');
        const canvasRatio = document.getElementById('canvas-ratio');
        const projectName = document.getElementById('project-name');
        const btnRecord = document.getElementById('btn-record');
        const recLabel = document.getElementById('rec-label');
        const btnPlay = document.getElementById('btn-play');
        const trackTitle = document.getElementById('track-title');

        // Layers & Audio State
        let bgImage = null;
        let audio = new Audio();
        let audioCtx, analyser, source, bufferLength, dataArray;
        let isPlaying = false;
        let isRecording = false;
        let mediaRecorder, recordedChunks = [];

        // Dynamic State Objects
        let vizState = { x: 128, y: 468, w: 1024, h: 180, style: 'bars-round' };
        let textState = { text: 'Studio Kecil 46', size: 48, opacity: 1, fx: 'plain', x: 640, y: 220 };
        let bgState = { darkness: 0.3, blur: 0 };

        // Ratio Switch Handler
        canvasRatio.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val === '16:9') { canvas.width = 1280; canvas.height = 720; }
            else if (val === '9:16') { canvas.width = 720; canvas.height = 1280; }
            else if (val === '1:1') { canvas.width = 1080; canvas.height = 1080; }
            else if (val === '4:5') { canvas.width = 864; canvas.height = 1080; }

            // Auto-reposition elements according to new canvas dimensions
            autoCenterElements();
            drawFrame();
        });

        function autoCenterElements() {
            textState.x = canvas.width / 2;
            textState.y = canvas.height * 0.3;
            vizState.w = canvas.width * 0.8;
            vizState.x = (canvas.width - vizState.w) / 2;
            vizState.y = canvas.height * 0.65;
            vizState.h = canvas.height * 0.2;
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                source = audioCtx.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 128;
                bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
            }
        }

        inputAudio.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                audio.src = URL.createObjectURL(file);
                trackTitle.innerText = file.name;
            }
        });

        inputBg.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    bgImage = new Image();
                    bgImage.onload = () => drawFrame();
                    bgImage.src = evt.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Event Controls
        document.getElementById('text-content').addEventListener('input', (e) => { textState.text = e.target.value; drawFrame(); });
        document.getElementById('text-size').addEventListener('input', (e) => { textState.size = e.target.value; drawFrame(); });
        document.getElementById('text-opacity').addEventListener('input', (e) => { textState.opacity = e.target.value; drawFrame(); });
        document.getElementById('bg-darkness').addEventListener('input', (e) => { bgState.darkness = e.target.value; drawFrame(); });
        document.getElementById('bg-blur').addEventListener('input', (e) => { bgState.blur = e.target.value; drawFrame(); });
        document.getElementById('viz-style').addEventListener('change', (e) => { vizState.style = e.target.value; drawFrame(); });

        window.alignViz = function(type) {
            if (type === 'center') { vizState.y = (canvas.height - vizState.h) / 2; }
            if (type === 'bottom') { vizState.y = canvas.height * 0.7; }
            if (type === 'full') { vizState.w = canvas.width * 0.95; vizState.x = canvas.width * 0.025; }
            if (type === 'reset') { autoCenterElements(); }
            drawFrame();
        };

        function drawFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Render Background
            if (bgImage) {
                ctx.save();
                if (bgState.blur > 0) ctx.filter = `blur(${bgState.blur}px)`;
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
                ctx.restore();
                ctx.fillStyle = `rgba(0,0,0,${bgState.darkness})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#0a0d0b';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // 2. Render Teks
            ctx.save();
            ctx.globalAlpha = textState.opacity;
            ctx.fillStyle = '#ffffff';
            ctx.font = `bold ${textState.size}px monospace`;
            ctx.textAlign = 'center';

            if (textState.fx === 'glow') {
                ctx.shadowColor = '#00ff66';
                ctx.shadowBlur = 18;
            } else if (textState.fx === 'shadow') {
                ctx.shadowColor = '#000000';
                ctx.shadowBlur = 10;
            }

            ctx.fillText(textState.text, textState.x, textState.y);
            ctx.restore();

            // 3. Render Visualizer Spektrum
            if (analyser) {
                analyser.getByteFrequencyData(dataArray);

                const grad = ctx.createLinearGradient(vizState.x, 0, vizState.x + vizState.w, 0);
                grad.addColorStop(0, '#ff0000');
                grad.addColorStop(0.2, '#ff7f00');
                grad.addColorStop(0.4, '#ffff00');
                grad.addColorStop(0.6, '#00ff66');
                grad.addColorStop(0.8, '#00ffff');
                grad.addColorStop(1, '#8b00ff');

                ctx.fillStyle = grad;
                const barW = vizState.w / bufferLength;

                for (let i = 0; i < bufferLength; i++) {
                    const barH = (dataArray[i] / 255) * vizState.h;
                    ctx.fillRect(vizState.x + (i * barW), vizState.y + vizState.h - barH, barW - 2, barH);
                }
            }

            if (isPlaying) requestAnimationFrame(drawFrame);
        }

        drawFrame();

        // Audio Play Button
        btnPlay.addEventListener('click', () => {
            if (!audio.src) return alert('Pilih file audio MP3 terlebih dahulu!');
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (!isPlaying) {
                audio.play();
                isPlaying = true;
                btnPlay.innerHTML = '<i class="fa-solid fa-pause"></i>';
                drawFrame();
            } else {
                audio.pause();
                isPlaying = false;
                btnPlay.innerHTML = '<i class="fa-solid fa-play"></i>';
            }
        });

        // Rekam & Download Video
        btnRecord.addEventListener('click', () => {
            if (!isRecording) {
                recordedChunks = [];
                const stream = canvas.captureStream(30);

                if (audioCtx) {
                    const dest = audioCtx.createMediaStreamDestination();
                    source.connect(dest);
                    const audioTrack = dest.stream.getAudioTracks()[0];
                    if (audioTrack) stream.addTrack(audioTrack);
                }

                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = exportVideo;

                mediaRecorder.start();
                isRecording = true;
                btnRecord.classList.replace('bg-rose-600', 'bg-amber-500');
                recLabel.innerText = 'Stop & Unduh';
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btnRecord.classList.replace('bg-amber-500', 'bg-rose-600');
                recLabel.innerText = 'Rekam';
            }
        });

        function exportVideo() {
            const fileName = (projectName.value.trim() || 'Visualizer_Output') + '.webm';
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            }, 100);
        }
    </script>
</body>
</html>
