<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Audio Visualizer Studio - Pro VIZ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { cyberGreen: '#00ff66', cyberDark: '#0a0f0d', islamicGold: '#fbbf24' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050907; color: #e2e8f0; }
        canvas { touch-action: none; cursor: crosshair; }
        /* Custom scrollbar mini ala VIZ */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #222; rounded: 2px; }
    </style>
</head>
<body class="bg-cyberDark text-slate-200 min-h-screen p-2 md:p-4 font-mono text-xs">

    <!-- Header Ringkas -->
    <div class="max-w-7xl mx-auto mb-2 flex items-center justify-between border-b border-slate-800 pb-2">
        <div class="flex items-center gap-2">
            <a href="../index.html" class="text-[11px] text-cyberGreen border border-cyberGreen/40 px-2 py-1 rounded hover:bg-cyberGreen hover:text-black transition">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1 class="font-bold text-islamicGold text-sm">🎨 Studio Visualizer VIZ</h1>
        </div>
        
        <!-- Action Top Bar -->
        <div class="flex gap-2">
            <button id="btn-record" class="bg-red-600 hover:bg-red-500 text-white font-bold px-3 py-1 rounded flex items-center gap-1.5 transition">
                <i class="fa-solid fa-circle text-[10px]"></i> <span id="rec-text">Rekam Video</span>
            </button>
        </div>
    </div>

    <!-- Main Container: Panel Kiri, Canvas Kanan -->
    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-3">
        
        <!-- PANEL KONTROL KIRI (Mode Ringkas Menu Kecil) -->
        <div class="lg:col-span-4 space-y-3 bg-black/80 border border-slate-800 p-3 rounded-xl max-h-[88vh] overflow-y-auto">
            
            <!-- 1. MEDIA INPUT -->
            <div class="space-y-1.5 bg-slate-900/50 p-2 rounded border border-slate-800">
                <div class="font-bold text-cyberGreen flex justify-between">
                    <span>1. AUDIO & BACKGROUND</span>
                </div>
                <div>
                    <label class="text-[10px] text-slate-400">Audio MP3:</label>
                    <input type="file" id="audio-input" accept="audio/*" class="w-full text-[11px] text-slate-300 bg-black border border-slate-700 rounded p-1">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400">Background Image:</label>
                    <input type="file" id="bg-input" accept="image/*" class="w-full text-[11px] text-slate-300 bg-black border border-slate-700 rounded p-1">
                </div>
                <div class="grid grid-cols-2 gap-2 pt-1">
                    <div>
                        <label class="text-[10px] text-slate-400">Gelap (Overlay):</label>
                        <input type="range" id="bg-darkness" min="0" max="1" step="0.05" value="0.3" class="w-full accent-cyberGreen">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400">Blur Background:</label>
                        <input type="range" id="bg-blur" min="0" max="15" value="0" class="w-full accent-cyberGreen">
                    </div>
                </div>
            </div>

            <!-- 2. VISUALIZER TRANSFORM & COLOR -->
            <div class="space-y-1.5 bg-slate-900/50 p-2 rounded border border-slate-800">
                <div class="font-bold text-islamicGold flex justify-between">
                    <span>2. SETTING VISUALIZER</span>
                    <span class="text-[9px] text-slate-500">Bisa di-drag di preview</span>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] text-slate-400">Gaya Warna:</label>
                        <select id="viz-color-mode" class="w-full bg-black text-white border border-slate-700 rounded p-1">
                            <option value="rainbow">Pelangi (Rainbow)</option>
                            <option value="neon">Neon Cyan/Green</option>
                            <option value="gold">Gold Islamic</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400">Bentuk Spectrum:</label>
                        <select id="viz-style" class="w-full bg-black text-white border border-slate-700 rounded p-1">
                            <option value="bar">Bars Round</option>
                            <option value="line">Garis Wave</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 3. TEKS & FONT -->
            <div class="space-y-1.5 bg-slate-900/50 p-2 rounded border border-slate-800">
                <div class="font-bold text-cyberGreen">3. TEKS & EFEK</div>
                <input type="text" id="text-input" value="Studio Kecil 46" class="w-full bg-black text-white border border-slate-700 rounded p-1">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] text-slate-400">Efek Teks:</label>
                        <select id="text-effect" class="w-full bg-black text-white border border-slate-700 rounded p-1">
                            <option value="glow">Glow Neon</option>
                            <option value="shadow">Shadow</option>
                            <option value="plain">Polos</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400">Warna Teks:</label>
                        <input type="color" id="text-color" value="#ffffff" class="w-full h-6 bg-black rounded border border-slate-700">
                    </div>
                </div>
            </div>

            <!-- PLAY PLAYER CONTROL -->
            <button id="btn-play" class="w-full bg-cyberGreen text-black py-2 rounded font-bold hover:bg-emerald-400 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-play"></i> PUTAR AUDIO
            </button>
        </div>

        <!-- CANVAS PREVIEW KANAN -->
        <div class="lg:col-span-8 flex flex-col items-center justify-center space-y-2">
            <div class="w-full aspect-video bg-black rounded-xl border border-slate-800 overflow-hidden relative shadow-2xl">
                <canvas id="viz-canvas" width="1280" height="720" class="w-full h-full object-contain"></canvas>
            </div>
            
            <div class="text-[10px] text-slate-400 flex items-center gap-4 bg-black/40 px-3 py-1 rounded border border-slate-800">
                <span><i class="fa-solid fa-up-down-left-right text-cyberGreen"></i> Klik & Drag di Canvas untuk pindahkan posisi.</span>
                <span><i class="fa-solid fa-expand text-islamicGold"></i> Tarik kotak sudut bawah-kanan untuk perbesar/perkecil.</span>
            </div>
        </div>

    </div>

    <!-- ENGINE CODE -->
    <script>
        const canvas = document.getElementById('viz-canvas');
        const ctx = canvas.getContext('2d');

        // Inputs & Controls
        const audioInput = document.getElementById('audio-input');
        const bgInput = document.getElementById('bg-input');
        const bgDarkness = document.getElementById('bg-darkness');
        const bgBlur = document.getElementById('bg-blur');
        const vizColorMode = document.getElementById('viz-color-mode');
        const vizStyle = document.getElementById('viz-style');
        const textInput = document.getElementById('text-input');
        const textEffect = document.getElementById('text-effect');
        const textColor = document.getElementById('text-color');
        const btnPlay = document.getElementById('btn-play');
        const btnRecord = document.getElementById('btn-record');
        const recText = document.getElementById('rec-text');

        // State Objects Transformers (Posisi & Ukuran)
        let objects = {
            viz: { x: 340, y: 480, w: 600, h: 180, selected: false },
            text: { x: 640, y: 200, size: 52, selected: false }
        };

        let activeTarget = null;
        let isResizing = false;
        let dragOffset = { x: 0, y: 0 };

        // Audio Engine
        let audio = new Audio();
        let audioCtx, analyser, source, bufferLength, dataArray;
        let bgImage = null;
        let isPlaying = false;

        // Recorder Engine
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;

        // Transform Mouse / Touch Handlers
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }

        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('mousemove', handlePointerMove);
        canvas.addEventListener('mouseup', handlePointerUp);
        canvas.addEventListener('touchstart', handlePointerDown);
        canvas.addEventListener('touchmove', handlePointerMove);
        canvas.addEventListener('touchend', handlePointerUp);

        function handlePointerDown(e) {
            const pos = getCanvasCoords(e);

            // Cek Klik Handle Resize Viz (Sudut kanan bawah Viz)
            const v = objects.viz;
            if (pos.x >= v.x + v.w - 20 && pos.x <= v.x + v.w + 20 && pos.y >= v.y + v.h - 20 && pos.y <= v.y + v.h + 20) {
                isResizing = true;
                activeTarget = 'viz';
                return;
            }

            // Cek Hit Visualizer Box
            if (pos.x >= v.x && pos.x <= v.x + v.w && pos.y >= v.y && pos.y <= v.y + v.h) {
                activeTarget = 'viz';
                dragOffset = { x: pos.x - v.x, y: pos.y - v.y };
                return;
            }

            // Cek Hit Teks
            const t = objects.text;
            if (Math.abs(pos.x - t.x) < 200 && Math.abs(pos.y - t.y) < 40) {
                activeTarget = 'text';
                dragOffset = { x: pos.x - t.x, y: pos.y - t.y };
                return;
            }

            activeTarget = null;
        }

        function handlePointerMove(e) {
            if (!activeTarget) return;
            const pos = getCanvasCoords(e);

            if (isResizing && activeTarget === 'viz') {
                objects.viz.w = Math.max(100, pos.x - objects.viz.x);
                objects.viz.h = Math.max(50, pos.y - objects.viz.y);
            } else if (activeTarget === 'viz') {
                objects.viz.x = pos.x - dragOffset.x;
                objects.viz.y = pos.y - dragOffset.y;
            } else if (activeTarget === 'text') {
                objects.text.x = pos.x - dragOffset.x;
                objects.text.y = pos.y - dragOffset.y;
            }

            if (!isPlaying) drawFrame();
        }

        function handlePointerUp() {
            activeTarget = null;
            isResizing = false;
        }

        // Upload Handlers
        bgInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    bgImage = new Image();
                    bgImage.onload = () => drawFrame();
                    bgImage.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        audioInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) audio.src = URL.createObjectURL(file);
        });

        [bgDarkness, bgBlur, vizColorMode, vizStyle, textInput, textEffect, textColor].forEach(el => {
            el.addEventListener('input', () => { if (!isPlaying) drawFrame(); });
        });

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                source = audioCtx.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 128;
                bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
            }
        }

        // Draw Canvas Loop
        function drawFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Background
            if (bgImage) {
                ctx.save();
                if (bgBlur.value > 0) ctx.filter = `blur(${bgBlur.value}px)`;
                ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
                ctx.restore();
                ctx.fillStyle = `rgba(0, 0, 0, ${bgDarkness.value})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#050907';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // 2. Draw Teks Overlay
            ctx.fillStyle = textColor.value;
            ctx.font = `bold ${objects.text.size}px monospace`;
            ctx.textAlign = 'center';

            if (textEffect.value === 'glow') {
                ctx.shadowColor = '#00ff66';
                ctx.shadowBlur = 15;
            } else if (textEffect.value === 'shadow') {
                ctx.shadowColor = '#000000';
                ctx.shadowBlur = 10;
            } else {
                ctx.shadowBlur = 0;
            }
            ctx.fillText(textInput.value || 'Studio Kecil 46', objects.text.x, objects.text.y);
            ctx.shadowBlur = 0;

            // 3. Draw Visualizer (Rainbow / Custom Gradient)
            const v = objects.viz;
            
            // Draw Box Transform / Select Indicator
            ctx.strokeStyle = 'rgba(0, 255, 102, 0.4)';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(v.x, v.y, v.w, v.h);
            ctx.setLineDash([]);

            // Draw Resize Handle Point (Sudut Kanan Bawah)
            ctx.fillStyle = '#00ff66';
            ctx.fillRect(v.x + v.w - 6, v.y + v.h - 6, 12, 12);

            if (analyser) {
                analyser.getByteFrequencyData(dataArray);

                // Buat Gradient Pelangi jika diset
                let gradient;
                if (vizColorMode.value === 'rainbow') {
                    gradient = ctx.createLinearGradient(v.x, 0, v.x + v.w, 0);
                    gradient.addColorStop(0, '#ff0000');
                    gradient.addColorStop(0.2, '#ff7f00');
                    gradient.addColorStop(0.4, '#ffff00');
                    gradient.addColorStop(0.6, '#00ff00');
                    gradient.addColorStop(0.8, '#0000ff');
                    gradient.addColorStop(1, '#8b00ff');
                } else if (vizColorMode.value === 'neon') {
                    gradient = ctx.createLinearGradient(0, v.y + v.h, 0, v.y);
                    gradient.addColorStop(0, '#00ff66');
                    gradient.addColorStop(1, '#00ffff');
                } else {
                    gradient = '#fbbf24';
                }

                ctx.fillStyle = gradient;
                ctx.strokeStyle = gradient;

                const barWidth = (v.w / bufferLength);

                if (vizStyle.value === 'bar') {
                    for (let i = 0; i < bufferLength; i++) {
                        const barHeight = (dataArray[i] / 255) * v.h;
                        ctx.fillRect(v.x + (i * barWidth), v.y + v.h - barHeight, barWidth - 2, barHeight);
                    }
                } else if (vizStyle.value === 'line') {
                    ctx.beginPath();
                    ctx.lineWidth = 4;
                    for (let i = 0; i < bufferLength; i++) {
                        const barHeight = (dataArray[i] / 255) * v.h;
                        const x = v.x + (i * barWidth);
                        const y = v.y + v.h - barHeight;
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.stroke();
                }
            }

            if (isPlaying) requestAnimationFrame(drawFrame);
        }

        drawFrame();

        // Audio Play Button
        btnPlay.addEventListener('click', () => {
            if (!audio.src) {
                alert('Pilih file MP3 terlebih dahulu!');
                return;
            }
            initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (!isPlaying) {
                audio.play();
                isPlaying = true;
                btnPlay.innerHTML = '<i class="fa-solid fa-pause"></i> PAUSE AUDIO';
                drawFrame();
            } else {
                audio.pause();
                isPlaying = false;
                btnPlay.innerHTML = '<i class="fa-solid fa-play"></i> PUTAR AUDIO';
            }
        });

        // REKAM VIDEO & UNDUH HASIL (EXPORT)
        btnRecord.addEventListener('click', () => {
            if (!isRecording) {
                // Mulai Rekam
                recordedChunks = [];
                const stream = canvas.captureStream(30); // 30 FPS

                // Gabungkan Audio Stream jika ada
                if (audioCtx) {
                    const dest = audioCtx.createMediaStreamDestination();
                    source.connect(dest);
                    const audioTrack = dest.stream.getAudioTracks()[0];
                    if (audioTrack) stream.addTrack(audioTrack);
                }

                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = exportVideo;

                mediaRecorder.start();
                isRecording = true;
                btnRecord.classList.replace('bg-red-600', 'bg-amber-500');
                recText.innerText = 'Stop & Download';
            } else {
                // Stop Rekam & Unduh
                mediaRecorder.stop();
                isRecording = false;
                btnRecord.classList.replace('bg-amber-500', 'bg-red-600');
                recText.innerText = 'Rekam Video';
            }
        });

        function exportVideo() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = 'murottal-visualizer-studio46.webm';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            }, 100);
        }
    </script>
</body>
</html>
