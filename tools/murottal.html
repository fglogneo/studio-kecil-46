<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murottal & Shalawat - Studio Kecil 46</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyberAmber: '#f59e0b',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .font-mono-custom { font-family: 'Space Mono', monospace; }
        .font-sans-custom { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans-custom">

    <!-- HEADER -->
    <header class="border-b border-slate-800 bg-black/60 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="../index.html" class="w-10 h-10 rounded-xl bg-black border border-amber-500/50 flex items-center justify-center text-amber-500 hover:bg-amber-500/20 transition">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <div>
                    <h1 class="text-base font-bold text-white tracking-wide">MUROTTAL & SHALAWAT</h1>
                    <span class="text-[10px] text-amber-500 font-mono-custom block">STUDIO KECIL 46</span>
                </div>
            </div>
            <span class="text-xs font-mono px-3 py-1 rounded-lg bg-amber-500/10 text-amber-500 border border-amber-500/30 font-bold hidden sm:block">
                Media Center
            </span>
        </div>
    </header>

    <!-- MAIN -->
    <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full space-y-6">

        <!-- TAB NAVIGASI -->
        <div class="flex gap-2 border-b border-slate-800 pb-4">
            <button onclick="switchTab('murottal')" id="btnTabMurottal" class="px-4 py-2 rounded-xl text-xs font-mono-custom font-bold bg-amber-500 text-black transition shadow-lg shadow-amber-500/20">
                <i class="fa-solid fa-book-quran mr-1.5"></i> Murottal Al-Quran
            </button>
            <button onclick="switchTab('shalawat')" id="btnTabShalawat" class="px-4 py-2 rounded-xl text-xs font-mono-custom font-bold bg-slate-900 text-slate-400 hover:text-white border border-slate-800 transition">
                <i class="fa-solid fa-music mr-1.5"></i> Lantunan Shalawat
            </button>
        </div>

        <!-- SECTION 1: MUROTTAL -->
        <div id="sectionMurottal" class="space-y-6">
            <div class="bg-black/60 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4">
                <h2 class="text-xs font-bold text-amber-400 font-mono-custom uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-sliders"></i> Pilih Surat & Qari
                </h2>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="space-y-1.5">
                        <label class="text-xs font-semibold text-slate-300">Surat</label>
                        <select id="selectSurah" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:border-amber-500 focus:outline-none">
                            <option value="">Memuat daftar surat...</option>
                        </select>
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-xs font-semibold text-slate-300">Qari</label>
                        <select id="selectReciter" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:border-amber-500 focus:outline-none">
                            <option value="ar.alafasy">Mishary Rashid Alafasy</option>
                            <option value="ar.abdurrahmansudais">Abdurrahman As-Sudais</option>
                            <option value="ar.minshawi">Mohamed Siddiq El-Minshawi</option>
                            <option value="ar.mahermuaiqly">Maher Al-Muaiqly</option>
                        </select>
                    </div>

                    <div class="flex items-end">
                        <button onclick="loadAyatAudio()" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-mono-custom font-bold py-2.5 rounded-xl text-xs transition shadow-lg shadow-amber-500/20">
                            <i class="fa-solid fa-play mr-1"></i> TAMPILKAN
                        </button>
                    </div>
                </div>
            </div>

            <!-- Container Hasil Ayat & Download Full -->
            <div id="containerAyat" class="space-y-3">
                <div class="text-center py-12 text-slate-500 font-mono text-xs bg-black/40 border border-slate-800 rounded-2xl">
                    Pilih surat dan qari, lalu klik "Tampilkan".
                </div>
            </div>
        </div>

        <!-- SECTION 2: SHALAWAT (Video Player Resmi / Stabil) -->
        <div id="sectionShalawat" class="hidden space-y-6">
            <div class="bg-black/60 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-2">
                <h2 class="text-xs font-bold text-amber-400 font-mono-custom uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-video"></i> Lantunan Shalawat Pilihan
                </h2>
                <p class="text-xs text-slate-400">Nikmati lantunan shalawat merdu</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <!-- Shalawat 1 -->
                <div class="bg-black/60 border border-slate-800 p-4 rounded-xl space-y-3 shadow-lg">
                    <h3 class="text-xs font-bold text-white flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-amber-500"></span> Shalawat Jibril Penarik Rezeki
                    </h3>
                    <div class="relative w-full aspect-video rounded-lg overflow-hidden bg-slate-900 border border-slate-800">
                        <iframe class="w-full h-full" src="https://www.youtube.com/embed/OP9iW9q_69g" title="Shalawat Jibril" allowfullscreen></iframe>
                    </div>
                </div>

                <!-- Shalawat 2 -->
                <div class="bg-black/60 border border-slate-800 p-4 rounded-xl space-y-3 shadow-lg">
                    <h3 class="text-xs font-bold text-white flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-amber-500"></span> Shalawat Nariyah Merdu
                    </h3>
                    <div class="relative w-full aspect-video rounded-lg overflow-hidden bg-slate-900 border border-slate-800">
                        <iframe class="w-full h-full" src="https://www.youtube.com/embed/g2J0NxbWv68" title="Shalawat Nariyah" allowfullscreen></iframe>
                    </div>
                </div>

            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="border-t border-slate-800 bg-black/40 py-4 text-center text-xs text-slate-500 font-mono-custom mt-auto">
        &copy; 2026 Studio Kecil 46
    </footer>

    <!-- SCRIPT -->
    <script>
        async function fetchSurahList() {
            const select = document.getElementById('selectSurah');
            try {
                const res = await fetch('https://api.alquran.cloud/v1/surah');
                const data = await res.json();
                if(data.code === 200) {
                    let options = '';
                    data.data.forEach(s => {
                        options += `<option value="${s.number}">${s.number}. ${s.englishName} - ${s.name} (${s.numberOfAyahs} Ayat)</option>`;
                    });
                    select.innerHTML = options;
                }
            } catch (err) {
                select.innerHTML = `<option value="">Gagal memuat surat</option>`;
                console.error(err);
            }
        }

        window.onload = function() {
            fetchSurahList();
        };

        function switchTab(tab) {
            const secMurottal = document.getElementById('sectionMurottal');
            const secShalawat = document.getElementById('sectionShalawat');
            const btnMurottal = document.getElementById('btnTabMurottal');
            const btnShalawat = document.getElementById('btnTabShalawat');

            if(tab === 'murottal') {
                secMurottal.classList.remove('hidden');
                secShalawat.classList.add('hidden');
                btnMurottal.className = "px-4 py-2 rounded-xl text-xs font-mono-custom font-bold bg-amber-500 text-black transition shadow-lg shadow-amber-500/20";
                btnShalawat.className = "px-4 py-2 rounded-xl text-xs font-mono-custom font-bold bg-slate-900 text-slate-400 hover:text-white border border-slate-800 transition";
            } else {
                secMurottal.classList.add('hidden');
                secShalawat.classList.remove('hidden');
                btnShalawat.className = "px-4 py-2 rounded-xl text-xs font-mono-custom font-bold bg-amber-500 text-black transition shadow-lg shadow-amber-500/20";
                btnMurottal.className = "px-4 py-2 rounded-xl text-xs font-mono-custom font-bold bg-slate-900 text-slate-400 hover:text-white border border-slate-800 transition";
            }
        }

        async function loadAyatAudio() {
            const surahId = document.getElementById('selectSurah').value;
            const reciter = document.getElementById('selectReciter').value;
            const container = document.getElementById('containerAyat');

            if(!surahId) {
                alert("Pilih surat terlebih dahulu!");
                return;
            }

            container.innerHTML = `<div class="text-center py-12 text-amber-400 font-mono text-xs"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Memuat data...</div>`;

            try {
                const res = await fetch(`https://api.alquran.cloud/v1/surah/${surahId}/${reciter}`);
                const data = await res.json();

                if(data.code === 200) {
                    const ayahs = data.data.ayahs;
                    const surahName = data.data.englishName;
                    const paddedSurahNum = String(surahId).padStart(3, '0');
                    
                    let fullAudioUrl = "";
                    if(reciter === 'ar.alafasy') {
                        fullAudioUrl = `https://server8.mp3quran.net/afs/${paddedSurahNum}.mp3`;
                    } else if(reciter === 'ar.abdurrahmansudais') {
                        fullAudioUrl = `https://server11.mp3quran.net/sds/${paddedSurahNum}.mp3`;
                    } else if(reciter === 'ar.minshawi') {
                        fullAudioUrl = `https://server10.mp3quran.net/minsh/${paddedSurahNum}.mp3`;
                    } else {
                        fullAudioUrl = `https://server13.mp3quran.net/maher/${paddedSurahNum}.mp3`;
                    }

                    // Panel atas untuk Download Full & Info Surat
                    let html = `
                        <div class="bg-black/60 border border-amber-500/40 p-4 rounded-xl flex flex-col sm:flex-row items-center justify-between gap-4 mb-4 shadow-lg">
                            <div>
                                <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/30">Full Audio Surat</span>
                                <h3 class="text-sm font-bold text-white mt-1">Surat ${surahName} (${ayahs.length} Ayat)</h3>
                            </div>
                            <a href="${fullAudioUrl}" download="Surat_${surahName}_Full.mp3" class="w-full sm:w-auto px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-black font-mono text-xs font-bold transition flex items-center justify-center gap-2 shadow-lg shadow-amber-500/20">
                                <i class="fa-solid fa-download"></i> Download Full (MP3)
                            </a>
                        </div>
                        <div class="text-xs font-mono text-slate-400 mb-2 px-1">Daftar Ayat (Cocok untuk Potongan Konten / Reels):</div>
                    `;

                    // Render daftar ayat dengan tombol download per ayat
                    ayahs.forEach((ayah) => {
                        html += `
                            <div class="bg-black/60 border border-slate-800 p-4 rounded-xl flex flex-col md:flex-row md:items-center justify-between gap-4">
                                <div class="space-y-1 flex-grow">
                                    <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-300">Ayat ${ayah.numberInSurah}</span>
                                    <p class="text-lg text-right font-serif text-white pt-1 leading-loose" dir="rtl">${ayah.text}</p>
                                </div>
                                <div class="flex items-center gap-3 flex-shrink-0 pt-3 md:pt-0 border-t md:border-t-0 border-slate-800 justify-between md:justify-end">
                                    <audio controls class="h-9 w-44 sm:w-56 accent-amber-500">
                                        <source src="${ayah.audio}" type="audio/mpeg">
                                    </audio>
                                    <a href="${ayah.audio}" download="Ayat_${ayah.numberInSurah}.mp3" class="px-3 py-2 rounded-lg bg-slate-900 hover:bg-amber-500 border border-slate-700 text-slate-300 hover:text-black font-mono text-xs font-bold transition flex items-center gap-1" title="Download Per Ayat">
                                        <i class="fa-solid fa-download"></i> <span class="hidden sm:inline">Ayat</span>
                                    </a>
                                </div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;
                } else {
                    throw new Error("Gagal mengambil data.");
                }
            } catch (err) {
                container.innerHTML = `<div class="text-center py-12 text-red-400 font-mono text-xs">Gagal memuat data audio.</div>`;
                console.error(err);
            }
        }
    </script>
</body>
</html>
