<!-- Script Pengambil Data API (Versi Ringan & Audio Cadangan) -->
    <script>
        const API_SURAH = 'https://equran.id/api/v2/surat';

        // 1. Memuat daftar Surah
        function fetchSurahList() {
            const select = document.getElementById('surah-select');
            
            fetch(API_SURAH)
                .then(res => res.json())
                .then(result => {
                    const data = result.data;
                    select.innerHTML = '<option value="">-- Pilih Surah --</option>';
                    data.forEach(surah => {
                        select.innerHTML += `<option value="${surah.nomor}">${surah.nomor}. ${surah.namaLatin} (${surah.nama}) - ${surah.arti}</option>`;
                    });
                })
                .catch(err => {
                    select.innerHTML = '<option value="">Gagal memuat surah. Periksa jaringan internet.</option>';
                });
        }

        // 2. Memuat Ayat dengan Lay-Loading Audio
        function loadAyat() {
            const surahNo = document.getElementById('surah-select').value;
            const container = document.getElementById('ayat-container');
            const infoBox = document.getElementById('surah-info');

            if (!surahNo) {
                container.innerHTML = '';
                infoBox.classList.add('hidden');
                return;
            }

            container.innerHTML = '<div class="text-center text-cyberGreen py-8"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Memuat ayat-ayat Al-Qur\'an...</div>';

            fetch(`https://equran.id/api/v2/surat/${surahNo}`)
                .then(res => res.json())
                .then(result => {
                    const data = result.data;

                    // Header Info Surah
                    document.getElementById('surah-title').innerText = `${data.namaLatin} (${data.nama})`;
                    document.getElementById('surah-subtitle').innerText = `Arti: ${data.arti} | Jumlah Ayat: ${data.jumlahAyat} | Tempat Turun: ${data.tempatTurun}`;
                    infoBox.classList.remove('hidden');

                    // Tampilkan Ayat
                    container.innerHTML = '';
                    
                    // Format penomoran surah untuk link audio cadangan (misal surah 2 jadi 002)
                    const paddedSurah = String(surahNo).padStart(3, '0');

                    data.ayat.forEach((ayat) => {
                        const paddedAyat = String(ayat.nomorAyat).padStart(3, '0');
                        
                        // Audio Utama dari API equran.id
                        const primaryAudio = ayat.audio['05'] || ayat.audio['01'];
                        // Audio Cadangan Resmi (EveryAyah Al-Afasy) jika audio utama kosong
                        const fallbackAudio = `https://www.everyayah.com/data/Alafasy_128kbps/${paddedSurah}${paddedAyat}.mp3`;
                        
                        const audioUrl = primaryAudio ? primaryAudio : fallbackAudio;

                        container.innerHTML += `
                            <div class="bg-black/50 border border-slate-800 hover:border-cyberGreen/50 p-5 rounded-xl space-y-4 transition">
                                <!-- Nomor Ayat & Pemutar Audio -->
                                <div class="text-xs text-cyberGreen font-bold flex justify-between items-center border-b border-slate-800 pb-2">
                                    <span>AYAT ${ayat.nomorAyat}</span>
                                    <!-- preload="none" agar browser tidak overload saat muat Al-Baqarah -->
                                    <audio controls preload="none" class="h-7 max-w-[200px]">
                                        <source src="${audioUrl}" type="audio/mpeg">
                                    </audio>
                                </div>
                                <!-- Teks Arab -->
                                <div class="text-right font-serif text-2xl md:text-3xl text-islamicGold leading-loose" style="font-family: 'Amiri', serif;">
                                    ${ayat.teksArab}
                                </div>
                                <!-- Bacaan Latin -->
                                <div class="text-xs text-cyberGreen/90 italic">
                                    📌 ${ayat.teksLatin}
                                </div>
                                <!-- Terjemahan Indonesia -->
                                <div class="text-xs text-slate-300">
                                    🇮🇩 <span class="font-sans">${ayat.teksIndonesia}</span>
                                </div>
                            </div>
                        `;
                    });
                })
                .catch(err => {
                    container.innerHTML = '<div class="text-center text-red-400 py-8">Gagal mengambil data ayat. Silakan coba lagi.</div>';
                });
        }

        fetchSurahList();
    </script>
