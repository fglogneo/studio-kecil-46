<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Al-Qur'an Digital - Studio Kecil 46</title>
    <!-- Tailwind CSS Standalone -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Arab -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyberGreen: '#00ff66',
                        cyberDark: '#050907',
                        islamicGold: '#fbbf24'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050907; color: #e2e8f0; }
        .font-arab { font-family: 'Amiri', serif; }
    </style>
</head>
<body class="bg-cyberDark text-slate-200 min-h-screen p-4 md:p-8 font-mono">

    <!-- Header & Tombol Kembali -->
    <div class="max-w-4xl mx-auto mb-6 flex items-center justify-between border-b border-cyberGreen/30 pb-4">
        <a href="../index.html" class="text-xs text-cyberGreen border border-cyberGreen/50 px-3 py-1.5 rounded hover:bg-cyberGreen hover:text-black transition">
            <i class="fa-solid fa-arrow-left mr-1"></i> Kembali
        </a>
        <h1 class="text-base md:text-lg font-bold text-islamicGold">📖 Al-Qur'an Digital</h1>
    </div>

    <!-- Container Utama -->
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Dropdown Pilih Surah -->
        <div class="bg-black/60 border border-cyberGreen/40 p-4 rounded-xl">
            <label class="block text-xs text-cyberGreen mb-2">PILIH SURAH:</label>
            <select id="surah-select" onchange="loadAyat()" class="w-full bg-slate-900 border border-slate-700 text-white p-3 rounded-lg focus:outline-none focus:border-cyberGreen text-sm">
                <option value="">-- Memuat Daftar Surah... --</option>
            </select>
        </div>

        <!-- Info Surah -->
        <div id="surah-info" class="hidden bg-slate-900/80 border border-islamicGold/40 p-4 rounded-xl text-center space-y-1">
            <h2 id="surah-title" class="text-lg md:text-xl font-bold text-islamicGold"></h2>
            <p id="surah-subtitle" class="text-xs text-slate-400"></p>
        </div>

        <!-- Wadah Daftar Ayat -->
        <div id="ayat-container" class="space-y-4"></div>

    </div>

    <script>
        const API_SURAH = 'https://equran.id/api/v2/surat';

        // Memuat Daftar Surah
        function fetchSurahList() {
            const select = document.getElementById('surah-select');
            fetch(API_SURAH)
                .then(res => res.json())
                .then(result => {
                    const data = result.data;
                    let options = '<option value="">-- Pilih Surah --</option>';
                    data.forEach(surah => {
                        options += `<option value="${surah.nomor}">${surah.nomor}. ${surah.namaLatin} (${surah.nama})</option>`;
                    });
                    select.innerHTML = options;
                })
                .catch(() => {
                    select.innerHTML = '<option value="">Gagal memuat surah. Coba refresh.</option>';
                });
        }

        // Memuat Ayat (Teknik Batch Render Optimization)
        function loadAyat() {
            const surahNo = document.getElementById('surah-select').value;
            const container = document.getElementById('ayat-container');
            const infoBox = document.getElementById('surah-info');

            if (!surahNo) {
                container.innerHTML = '';
                infoBox.classList.add('hidden');
                return;
            }

            container.innerHTML = '<div class="text-center text-cyberGreen py-8"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Memuat ayat...</div>';

            fetch(`https://equran.id/api/v2/surat/${surahNo}`)
                .then(res => res.json())
                .then(result => {
                    const data = result.data;

                    document.getElementById('surah-title').innerText = `${data.namaLatin} (${data.nama})`;
                    document.getElementById('surah-subtitle').innerText = `Arti: ${data.arti} | Jumlah Ayat: ${data.jumlahAyat}`;
                    infoBox.classList.remove('hidden');

                    const paddedSurah = String(surahNo).padStart(3, '0');
                    
                    // Gunakan Array + join untuk mempercepat proses pembuatan HTML
                    const htmlItems = data.ayat.map((ayat) => {
                        const paddedAyat = String(ayat.nomorAyat).padStart(3, '0');
                        const primaryAudio = ayat.audio['05'] || ayat.audio['01'];
                        const fallbackAudio = `https://www.everyayah.com/data/Alafasy_128kbps/${paddedSurah}${paddedAyat}.mp3`;
                        const audioUrl = primaryAudio || fallbackAudio;

                        return `
                            <div class="w-full h-auto bg-black/50 border border-slate-800 p-4 md:p-5 rounded-xl flex flex-col justify-between space-y-3 overflow-hidden">
                                <div class="text-xs text-cyberGreen font-bold flex justify-between items-center border-b border-slate-800/80 pb-2 gap-2 flex-wrap">
                                    <span>AYAT ${ayat.nomorAyat}</span>
                                    <audio controls preload="none" class="h-7 max-w-[160px] md:max-w-[200px]">
                                        <source src="${audioUrl}" type="audio/mpeg">
                                    </audio>
                                </div>
                                <div class="text-right font-arab text-2xl md:text-3xl text-islamicGold leading-[2.2] break-words my-2" dir="rtl">
                                    ${ayat.teksArab}
                                </div>
                                <div class="text-xs text-cyberGreen/90 italic break-words leading-relaxed">
                                    📌 ${ayat.teksLatin}
                                </div>
                                <div class="text-xs text-slate-300 font-sans break-words leading-relaxed">
                                    🇮🇩 ${ayat.teksIndonesia}
                                </div>
                            </div>
                        `;
                    });

                    container.innerHTML = htmlItems.join('');
                })
                .catch(() => {
                    container.innerHTML = '<div class="text-center text-red-400 py-8">Gagal mengambil data ayat.</div>';
                });
        }

        fetchSurahList();
    </script>
</body>
</html>
