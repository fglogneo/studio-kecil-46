<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poster & Quotes Generator - Studio Kecil 46</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyberGreen: '#00ff66',
                        islamicGold: '#d4af37',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-arabic { font-family: 'Amiri', serif; }
        .font-mono-custom { font-family: 'Space Mono', monospace; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- NAVBAR -->
    <header class="border-b border-slate-800 bg-black/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="../index.html" class="w-10 h-10 rounded-lg bg-black border border-teal-400/50 flex items-center justify-center text-teal-400 hover:bg-teal-400/20 transition">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <div>
                    <h1 class="text-base font-bold text-white tracking-wide">POSTER & QUOTES GENERATOR</h1>
                    <span class="text-[10px] text-teal-400 font-mono-custom block">STUDIO KECIL 46 // MULTI-THEME CREATOR</span>
                </div>
            </div>
            <a href="../index.html" class="text-xs font-mono-custom text-slate-400 hover:text-white transition">
                <i class="fa-solid fa-house mr-1"></i> Beranda
            </a>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full grid grid-cols-1 lg:grid-cols-12 gap-8">

        <!-- PANEL KONTROL / EDITOR (5 Kolom) -->
        <div class="lg:col-span-5 space-y-6 bg-black/60 border border-slate-800 p-6 rounded-2xl h-fit">
            <h2 class="text-sm font-bold text-teal-400 font-mono-custom uppercase tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-sliders"></i> Panel Pengaturan Teks
            </h2>

            <!-- Pilihan Tema -->
            <div class="space-y-2">
                <label class="text-xs font-semibold text-slate-300">Pilih Tema Poster</label>
                <select id="themeSelect" onchange="updateTheme()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:border-teal-400 focus:outline-none transition">
                    <option value="islamic">🕌 Tema Islami / Islamic Quotes</option>
                    <option value="motivation">🔥 Tema Motivasi & Semangat</option>
                    <option value="education">📚 Tema Edukasi & Pendidikan</option>
                    <option value="life">🌱 Tema Kehidupan & Bijak</option>
                </select>
            </div>

            <!-- Khusus Input Tema Islami (Teks Arab) -->
            <div id="arabicSection" class="space-y-2">
                <label class="text-xs font-semibold text-slate-300 flex justify-between">
                    <span>Teks Arab (Opsional)</span>
                    <span class="text-[10px] text-islamicGold">Opsional untuk Ayat/Hadits</span>
                </label>
                <textarea id="inputArabic" rows="2" oninput="liveUpdate()" placeholder="اكتب النص العربي هنا..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-right font-arabic text-islamicGold focus:border-islamicGold focus:outline-none transition"></textarea>
            </div>

            <!-- Input Utama / Isi Quotes -->
            <div class="space-y-2">
                <label class="text-xs font-semibold text-slate-300">Teks Utama / Terjemahan / Pesan</label>
                <textarea id="inputMainText" rows="3" oninput="liveUpdate()" placeholder="Masukkan isi quotes atau pesan poster di sini..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:border-teal-400 focus:outline-none transition">“Sesungguhnya bersama kesulitan itu ada kemudahan.”</textarea>
            </div>

            <!-- Penulis / Referensi -->
            <div class="space-y-2">
                <label class="text-xs font-semibold text-slate-300">Penulis / Sumber / Watermark</label>
                <input type="text" id="inputAuthor" value="QS. Al-Insyirah: 6" oninput="liveUpdate()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white focus:border-teal-400 focus:outline-none transition">
            </div>

            <!-- Pilihan Warna Aksen Poster -->
            <div class="space-y-2">
                <label class="text-xs font-semibold text-slate-300">Kombinasi Warna Tema</label>
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="setAccent('gold')" class="h-9 rounded-lg bg-amber-500/20 border border-islamicGold text-islamicGold text-xs font-mono font-bold hover:bg-amber-500/40 transition">Gold</button>
                    <button onclick="setAccent('green')" class="h-9 rounded-lg bg-cyberGreen/20 border border-cyberGreen text-cyberGreen text-xs font-mono font-bold hover:bg-cyberGreen/40 transition">Green</button>
                    <button onclick="setAccent('purple')" class="h-9 rounded-lg bg-purple-500/20 border border-purple-500 text-purple-500 text-xs font-mono font-bold hover:bg-purple-500/40 transition">Purple</button>
                    <button onclick="setAccent('cyan')" class="h-9 rounded-lg bg-teal-400/20 border border-teal-400 text-teal-400 text-xs font-mono font-bold hover:bg-teal-400/40 transition">Cyan</button>
                </div>
            </div>

            <!-- Tombol Aksi -->
            <button onclick="alert('Fitur download poster siap dikembangkan atau langsung screenshot area preview di sebelah kanan!')" class="w-full bg-teal-400 hover:bg-teal-300 text-black font-mono-custom font-bold py-3 rounded-xl text-xs transition shadow-lg shadow-teal-400/20 flex items-center justify-center gap-2">
                <i class="fa-solid fa-download"></i> SIMPAN / DOWNLOAD POSTER
            </button>
        </div>

        <!-- PANEL PREVIEW POSTER (7 Kolom) -->
        <div class="lg:col-span-7 flex flex-col items-center justify-center bg-slate-900/40 border border-slate-800 p-6 rounded-2xl relative min-h-[450px]">
            <span class="absolute top-4 left-4 text-[10px] font-mono-custom text-slate-500 uppercase tracking-widest">Live Preview Area</span>

            <!-- KOTAK POSTER UTAMA (Rasio Instagram/Media Sosial) -->
            <div id="posterBox" class="w-full max-w-md aspect-[4/5] bg-gradient-to-br from-slate-900 via-slate-950 to-black border-2 border-islamicGold rounded-2xl p-8 flex flex-col justify-between shadow-2xl relative overflow-hidden transition-all duration-300">
                
                <!-- Hiasan Background Pattern / Glow -->
                <div id="posterGlow" class="absolute -top-24 -right-24 w-48 h-48 bg-islamicGold/10 rounded-full blur-3xl pointer-events-none"></div>

                <!-- Header Poster -->
                <div class="flex items-center justify-between z-10">
                    <span id="previewBadge" class="text-[10px] font-mono-custom tracking-widest uppercase px-3 py-1 rounded-full bg-islamicGold/10 border border-islamicGold text-islamicGold">
                        ISLAMIC QUOTES
                    </span>
                    <span class="text-[10px] font-mono-custom text-slate-400">STUDIO KECIL 46</span>
                </div>

                <!-- Konten Teks di Tengah -->
                <div class="my-auto space-y-6 text-center z-10">
                    <!-- Teks Arab (Hanya tampil jika ada isi) -->
                    <div id="previewArabic" class="text-2xl lg:text-3xl font-arabic text-islamicGold leading-loose" style="direction: rtl;">
                        فَإِنَّ مَعَ الْعُسْرِ يُسْرًا
                    </div>
                    
                    <!-- Teks Utama -->
                    <p id="previewMainText" class="text-sm lg:text-base font-sans text-slate-100 leading-relaxed px-2">
                        “Sesungguhnya bersama kesulitan itu ada kemudahan.”
                    </p>
                </div>

                <!-- Footer / Sumber Quotes -->
                <div class="flex items-center justify-between pt-4 border-t border-slate-800 z-10">
                    <span id="previewAuthor" class="text-xs font-mono-custom font-bold text-slate-300">
                        QS. Al-Insyirah: 6
                    </span>
                    <div class="w-6 h-6 rounded-full bg-black border border-slate-700 flex items-center justify-center text-[10px] text-slate-400">
                        46
                    </div>
                </div>

            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="border-t border-slate-800 bg-black/40 py-4 text-center text-xs text-slate-500 font-mono-custom">
        &copy; 2026 Studio Kecil 46 - Creator Toolkit
    </footer>

    <!-- SCRIPT INTERAKTIF -->
    <script>
        function liveUpdate() {
            const arabicVal = document.getElementById('inputArabic').value;
            const mainTextVal = document.getElementById('inputMainText').value;
            const authorVal = document.getElementById('inputAuthor').value;

            document.getElementById('previewArabic').innerText = arabicVal;
            document.getElementById('previewMainText').innerText = mainTextVal;
            document.getElementById('previewAuthor').innerText = authorVal;

            // Sembunyikan elemen arab jika kosong
            if(arabicVal.trim() === "") {
                document.getElementById('previewArabic').style.display = 'none';
            } else {
                document.getElementById('previewArabic').style.display = 'block';
            }
        }

        function updateTheme() {
            const theme = document.getElementById('themeSelect').value;
            const badge = document.getElementById('previewBadge');
            const arabicSec = document.getElementById('arabicSection');

            if(theme === 'islamic') {
                badge.innerText = "ISLAMIC QUOTES";
                arabicSec.style.display = 'block';
                document.getElementById('inputArabic').value = "فَإِنَّ مَعَ الْعُسْرِ يُسْرًا";
                document.getElementById('inputMainText').value = "“Sesungguhnya bersama kesulitan itu ada kemudahan.”";
                document.getElementById('inputAuthor').value = "QS. Al-Insyirah: 6";
                setAccent('gold');
            } else if(theme === 'motivation') {
                badge.innerText = "MOTIVATION VIBES";
                arabicSec.style.display = 'none';
                document.getElementById('inputArabic').value = "";
                document.getElementById('inputMainText').value = "“Jangan berhenti ketika lelah, berhentilah ketika kamu selesai.”";
                document.getElementById('inputAuthor').value = "@studiokecil46";
                setAccent('green');
            } else if(theme === 'education') {
                badge.innerText = "EDU KNOWLEDGE";
                arabicSec.style.display = 'none';
                document.getElementById('inputArabic').value = "";
                document.getElementById('inputMainText').value = "“Pendidikan bukan persiapan untuk hidup; pendidikan adalah hidup itu sendiri.”";
                document.getElementById('inputAuthor').value = "John Dewey";
                setAccent('cyan');
            } else if(theme === 'life') {
                badge.innerText = "LIFE WISDOM";
                arabicSec.style.display = 'none';
                document.getElementById('inputArabic').value = "";
                document.getElementById('inputMainText').value = "“Hiduplah seolah engkau mati besok. Belajarlah seolah engkau hidup selamanya.”";
                document.getElementById('inputAuthor').value = "Mahatma Gandhi";
                setAccent('purple');
            }
            liveUpdate();
        }

        function setAccent(color) {
            const posterBox = document.getElementById('posterBox');
            const badge = document.getElementById('previewBadge');
            const glow = document.getElementById('posterGlow');

            // Reset classes
            posterBox.className = "w-full max-w-md aspect-[4/5] bg-gradient-to-br from-slate-900 via-slate-950 to-black rounded-2xl p-8 flex flex-col justify-between shadow-2xl relative overflow-hidden transition-all duration-300";
            
            if(color === 'gold') {
                posterBox.classList.add('border-2', 'border-islamicGold');
                badge.className = "text-[10px] font-mono-custom tracking-widest uppercase px-3 py-1 rounded-full bg-islamicGold/10 border border-islamicGold text-islamicGold";
                document.getElementById('previewArabic').className = "text-2xl lg:text-3xl font-arabic text-islamicGold leading-loose";
                glow.className = "absolute -top-24 -right-24 w-48 h-48 bg-islamicGold/10 rounded-full blur-3xl pointer-events-none";
            } else if(color === 'green') {
                posterBox.classList.add('border-2', 'border-cyberGreen');
                badge.className = "text-[10px] font-mono-custom tracking-widest uppercase px-3 py-1 rounded-full bg-cyberGreen/10 border border-cyberGreen text-cyberGreen";
                glow.className = "absolute -top-24 -right-24 w-48 h-48 bg-cyberGreen/10 rounded-full blur-3xl pointer-events-none";
            } else if(color === 'purple') {
                posterBox.classList.add('border-2', 'border-purple-500');
                badge.className = "text-[10px] font-mono-custom tracking-widest uppercase px-3 py-1 rounded-full bg-purple-500/10 border border-purple-500 text-purple-500";
                glow.className = "absolute -top-24 -right-24 w-48 h-48 bg-purple-500/10 rounded-full blur-3xl pointer-events-none";
            } else if(color === 'cyan') {
                posterBox.classList.add('border-2', 'border-teal-400');
                badge.className = "text-[10px] font-mono-custom tracking-widest uppercase px-3 py-1 rounded-full bg-teal-400/10 border border-teal-400 text-teal-400";
                glow.className = "absolute -top-24 -right-24 w-48 h-48 bg-teal-400/10 rounded-full blur-3xl pointer-events-none";
            }
        }
    </script>
</body>
</html>
